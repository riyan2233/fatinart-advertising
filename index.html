:3px solid white;box-shadow:0 0 0 1px #d9d9df;cursor:pointer}.swatch.active{box-shadow:0 0 0 3px var(--accent)}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.template{border:2px solid var(--border);border-radius:14px;padding:17px;cursor:pointer;background:var(--card);text-align:left}.template.active{border-color:var(--accent)}.template b{display:block;margin:8px 0 5px}.template small{color:var(--muted)}.notice{background:#fff6df;padding:13px 15px;border-radius:12px;color:#806126;font-size:12px;line-height:1.7;margin-bottom:16px}.status{font-size:12px;color:var(--muted)}.preview{width:100%;max-height:175px;object-fit:contain;background:#f4f4f7;border-radius:12px;margin:8px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{padding:5px 9px;border-radius:20px;background:#f1f2f7;font-size:10px;font-weight:800}.toast{position:fixed;right:18px;bottom:18px;background:#202333;color:white;padding:14px 19px;border-radius:13px;z-index:100;box-shadow:0 12px 35px #0004;font-size:13px}.hidden{display:none!important}

const KEY='fatin_art_premium_v1';
const OLD_KEY='fatin_art_state_v3';
const defaults={products:DEFAULT_PRODUCTS,settings:{business:'FATIN ART ADVERTISING',subtitle:'Percetakan & Desain Grafis',headline:'Cetak impianmu, <em>jadi kenyataan.</em>',description:'Dari banner, undangan, stempel, hingga sablon. Hasil premium, proses cepat, dan harga bersahabat untuk semua kebutuhan.',wa:'6282220221045',address:'Dusun Tengororejo, Desa Songgon, Banyuwangi',logo:'',accent:'#f45a35',template:'creative',showPrices:true},orders:[],adminHash:''};
let state,cart=[],category='Semua',search='',view='catalog',tab='products',editing=null;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const safeImg=x=>/^(https?:\/\/|data:image\/(png|jpeg|webp);base64,)/i.test(x||'')?x:'';
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.products)){state={...structuredClone(defaults),...d,settings:{...defaults.settings,...d.settings}};return}}catch(e){}state=structuredClone(defaults);try{let old=JSON.parse(localStorage.getItem(OLD_KEY));if(old?.products?.length)state.products=old.products.map(p=>({...p,img:safeImg(p.img)}))}catch(e){}save()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Penyimpanan browser penuh. Kurangi ukuran foto atau ekspor cadangan.');return false}}
function toast(s){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function applyTheme(){document.documentElement.style.setProperty('--accent',state.settings.accent);document.body.dataset.template=state.settings.template;document.querySelector('meta[name="theme-color"]').content=state.settings.accent}
function logo(){return state.settings.logo?`<img class="logo" src="${safeImg(state.settings.logo)}" alt="Logo">`:'<div class="logo-fallback">✦</div>'}
function header(){return `<header class="top"><div class="container nav">${logo()}<a class="brand" href="${location.pathname}" onclick="event.preventDefault();view='catalog';render()">${esc(state.settings.business)}<small>${esc(state.settings.subtitle).toUpperCase()}</small></a><nav class="navlinks"><a href="#produk">Katalog Produk</a><a href="#tentang">Tentang Kami</a><a href="#" onclick="event.preventDefault();share()">Bagikan Katalog</a></nav><button class="btn outline sm cart-button" onclick="openCart()">🛒 Keranjang <span class="count" id="cartCount">${cart.reduce((a,x)=>a+x.qty,0)}</span></button></div></header>`}
function publicView(){let cats=['Semua',...new Set(state.products.map(p=>p.category).filter(Boolean))];let items=state.products.filter(p=>(category==='Semua'||p.category===category)&&(`${p.name} ${p.desc} ${p.category}`).toLowerCase().includes(search.toLowerCase()));return `${header()}<div class="container"><section class="hero"><div class="hero-inner"><span class="eyebrow">✦ KATALOG DIGITAL PREMIUM</span><h1>${state.settings.headline.replace(/<(?!\/?em\b)[^>]*>/gi,'')}</h1><p>${esc(state.settings.description)}</p><div class="hero-actions"><a class="btn" href="#produk">Jelajahi Katalog ↗</a><a class="btn light" href="${waLink('Halo, saya ingin konsultasi cetak.')}" target="_blank" rel="noopener">☏ Konsultasi Gratis</a></div></div></section><div class="benefits"><div class="benefit"><div class="benefit-icon">⚡</div><div><b>Proses Satset</b><small>Cepat dan tepat waktu</small></div></div><div class="benefit"><div class="benefit-icon">✦</div><div><b>Hasil Berkualitas</b><small>Detail tajam, warna maksimal</small></div></div><div class="benefit"><div class="benefit-icon">🤝</div><div><b>Harga Bersahabat</b><small>Untuk personal dan usaha</small></div></div></div><section id="produk"><div class="section-head"><div><h2>Pilihan produk terbaik</h2><p>Temukan kebutuhan cetak dan promosi favorit Anda.</p></div><input class="search" id="search" placeholder="⌕  Cari produk, undangan, stiker..." value="${esc(search)}" oninput="search=this.value;drawProducts()"></div><div class="filters" id="filters">${cats.map(c=>`<button class="chip ${c===category?'active':''}" data-category="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="products" id="products">${productCards(items)}</div></section></div>${footer()}`}
function productCards(items){return items.length?items.map(p=>`<article class="product"><div class="photo"><img loading="lazy" src="${safeImg(p.img)}" alt="${esc(p.name)}" onerror="this.style.opacity='.15'"><span class="tag">${esc(p.category)}</span></div><div class="product-body"><h3>${esc(p.name)}</h3><p class="desc">${esc(p.desc)}</p><div class="buyrow"><div>${state.settings.showPrices?`<div class="price">${money(p.price)}</div>`:'<span class="pill">Tanya harga</span>'}</div><button class="btn sm" data-add="${esc(p.id)}">+ Pesan</button></div></div></article>`).join(''):'<div class="empty">Tidak ada produk yang cocok. Coba kata kunci lain.</div>'}
function drawProducts(){let items=state.products.filter(p=>(category==='Semua'||p.category===category)&&(`${p.name} ${p.desc} ${p.category}`).toLowerCase().includes(search.toLowerCase()));$('products').innerHTML=productCards(items)}
function footer(){return `<footer id="tentang" class="foot"><div class="container foot-inner"><div><h3>${esc(state.settings.business)}</h3><p>${esc(state.settings.description)}</p><p>© ${new Date().getFullYear()} • Katalog Digital Fatin Art • Murah – Berkualitas – Satset</p></div><div><h3>Hubungi Kami</h3><p>📍 ${esc(state.settings.address)}</p><a class="btn sm" target="_blank" href="${waLink('Halo Fatin Art!')}">WhatsApp Admin ↗</a></div></div></footer>`}
function waLink(msg){let phone=String(state.settings.wa).replace(/\D/g,'');if(phone.startsWith('0'))phone='62'+phone.slice(1);return 'https://wa.me/'+phone+'?text='+encodeURIComponent(msg)}
function share(){let url=new URL(location.href);url.search='';url.hash='';if(navigator.share)navigator.share({title:state.settings.business,url:url.href}).catch(()=>{});else navigator.clipboard?.writeText(url.href).then(()=>toast('Link katalog disalin')).catch(()=>prompt('Salin link katalog:',url.href))}
function add(id){let p=state.products.find(x=>x.id===id);if(!p)return;let i=cart.find(x=>x.id===id);if(i)i.qty++;else cart.push({id,qty:1});toast('Produk masuk keranjang');render()}
function modal(title,body){$('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}</div></div>`}
function closeModal(){$('modal-root').innerHTML=''}
function openCart(){modal('Keranjang pesanan',cart.length?`${cart.map(x=>{let p=state.products.find(p=>p.id===x.id);return p?`<div class="cartline"><img src="${safeImg(p.img)}"><div class="grow"><b>${esc(p.name)}</b><small>${money(p.price)}</small></div><div class="qty"><button data-qty="${esc(x.id)}" data-delta="-1">−</button><b>${x.qty}</b><button data-qty="${esc(x.id)}" data-delta="1">+</button></div></div>`:''}).join('')}<div class="total"><span>Estimasi total</span><span>${money(cart.reduce((n,x)=>n+(state.products.find(p=>p.id===x.id)?.price||0)*x.qty,0))}</span></div><button class="btn full" onclick="checkout()">Lanjutkan pemesanan →</button>`:'<p class="muted">Keranjang masih kosong. Pilih produk yang ingin dipesan.</p>')}
function qty(id,d){let x=cart.find(x=>x.id===id);if(x){x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i!==x)}render();openCart()}
function checkout(){if(!cart.length)return;modal('Data pemesan',`<form id="checkoutForm"><div class="formrow"><label>Nama lengkap<input class="field" name="name" required maxlength="100" placeholder="Nama pemesan"></label></div><div class="formrow"><label>Nomor WhatsApp<input class="field" name="phone" required inputmode="tel" placeholder="08xxxxxxxxxx"></label></div><div class="formrow"><label>Alamat / catatan kebutuhan<textarea class="field" name="notes" rows="3" placeholder="Ukuran, jumlah, bahan, alamat pengiriman..."></textarea></label></div><p class="notice">Pesanan akan disiapkan sebagai pesan WhatsApp. Admin perlu mengonfirmasi pesanan dan harga akhir.</p><button class="btn full" type="submit">Kirim pesanan ke WhatsApp ↗</button></form>`)}
function submitCheckout(f){let data=new FormData(f);let items=cart.map(x=>{let p=state.products.find(p=>p.id===x.id);return {name:p?.name||'Produk',qty:x.qty,price:p?.price||0}});let total=items.reduce((n,i)=>n+i.qty*i.price,0);let id='FA-'+Date.now().toString(36).toUpperCase();let order={id,name:String(data.get('name')).trim(),phone:String(data.get('phone')).trim(),notes:String(data.get('notes')).trim(),items,total,status:'Menunggu konfirmasi',date:new Date().toLocaleString('id-ID')};state.orders.unshift(order);save();let message=`Halo Admin ${state.settings.business}, saya ingin memesan.\nNo. Pesanan: ${id}\nNama: ${order.name}\nWA: ${order.phone}\n\n${items.map(i=>`• ${i.name} x${i.qty} — ${money(i.qty*i.price)}`).join('\n')}\n\nEstimasi: ${money(total)}\nCatatan: ${order.notes||'-'}\nMohon konfirmasi ketersediaan dan total akhir.`;let link=waLink(message);cart=[];closeModal();render();window.open(link,'_blank','noopener');toast('Pesanan tersimpan di browser ini. Kirim pesan WhatsApp untuk konfirmasi.')}
async function hashPin(pin){let bytes=new TextEncoder().encode('fatin-art-admin-v1:'+pin);let d=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}
function adminGate(){if(!window.isSecureContext||!crypto.subtle){modal('Akses admin','<p class="notice">Panel admin membutuhkan HTTPS atau localhost untuk menyimpan PIN dengan hash.</p>');return}if(sessionStorage.getItem('fa_admin_ok')==='1'){view='admin';render();return}modal(state.adminHash?'Masuk admin':'Atur PIN admin perangkat ini',`<p class="notice">Mode admin hanya untuk pengelolaan lokal. PIN browser bukan sistem autentikasi server; untuk keamanan dan sinkronisasi antar perangkat diperlukan Firebase Authentication dan database online.</p><form id="pinForm"><div class="formrow"><label>${state.adminHash?'PIN admin':'Buat PIN minimal 6 karakter'}<input class="field" type="password" name="pin" minlength="6" required autocomplete="off"></label></div><button class="btn full">Lanjutkan</button></form>`)}
async function submitPin(f){let pin=f.elements.pin.value;if(pin.length<6)return toast('PIN minimal 6 karakter');let h=await hashPin(pin);if(state.adminHash&&state.adminHash!==h){toast('PIN salah');return}if(!state.adminHash){state.adminHash=h;save()}sessionStorage.setItem('fa_admin_ok','1');view='admin';closeModal();render()}
function logoutAdmin(){sessionStorage.removeItem('fa_admin_ok');view='catalog';history.replaceState(null,'',location.pathname);render()}
function adminView(){if(sessionStorage.getItem('fa_admin_ok')!=='1'){view='catalog';return publicView()}return `${header()}<div class="container admin-shell"><div class="admin-heading"><div><h1>Studio Admin <span style="color:var(--accent)">✦</span></h1><p>Kelola seluruh isi katalog, identitas bisnis, tampilan dan pesanan.</p></div><div class="row"><button class="btn outline sm" onclick="view='catalog';render()">👁 Lihat katalog</button><button class="btn ghost sm" onclick="logoutAdmin()">Keluar admin</button></div></div><div class="notice">Penyimpanan saat ini hanya di browser/perangkat ini. Perubahan produk dan foto tidak otomatis muncul di HP pembeli lain. Gunakan ekspor/impor untuk cadangan; sambungkan backend agar katalog online tersinkron.</div><div class="tabs">${[['products','📦 Produk'],['design','🎨 Tema & Template'],['settings','⚙️ Pengaturan'],['orders','🧾 Pesanan'],['backup','💾 Cadangan']].map(([id,n])=>`<button class="chip ${tab===id?'active':''}" data-tab="${id}">${n}</button>`).join('')}</div><div class="panel">${adminPanel()}</div></div>`}
function adminPanel(){if(tab==='products')return `<div class="row" style="margin-bottom:18px"><h3>Produk (${state.products.length})</h3><button class="btn sm" onclick="editProduct()">+ Tambah produk</button></div><div class="admin-products">${state.products.map(p=>`<div class="admin-product"><img src="${safeImg(p.img)}" alt=""><div class="grow"><b>${esc(p.name)}</b><small>${esc(p.category)} · ${money(p.price)}</small></div><div class="admin-actions"><button class="btn ghost sm" data-edit="${esc(p.id)}">Edit</button><button class="btn red sm" data-delete="${esc(p.id)}">Hapus</button></div></div>`).join('')}</div>`;
if(tab==='design')return `<h3>Template katalog</h3><p class="small muted">Ubah gaya desain tanpa menghapus data produk.</p><div class="templates">${[['creative','Creative Studio','Modern, cerah, energik'],['minimal','Clean Minimal','Putih, lapang, profesional'],['luxury','Luxury Edition','Gelap, premium, elegan']].map(([id,name,desc])=>`<button class="template ${state.settings.template===id?'active':''}" data-template="${id}"><span style="font-size:26px">${id==='creative'?'✦':id==='minimal'?'◻':'◆'}</span><b>${name}</b><small>${desc}</small></button>`).join('')}</div><h3 style="margin-top:28px">Warna tema</h3><div class="palette">${['#f45a35','#0e9f86','#5167d7','#a044a4','#d69c32','#202938','#df3e65'].map(c=>`<button class="swatch ${state.settings.accent===c?'active':''}" style="background:${c}" data-color="${c}" aria-label="Warna ${c}"></button>`).join('')}</div><p class="small muted">Perubahan tema langsung diterapkan dan disimpan.</p>`;
if(tab==='settings')return `<h3>Identitas dan konten katalog</h3><form id="settingsForm"><div class="formgrid"><div class="formrow"><label>Nama usaha<input class="field" name="business" required value="${esc(state.settings.business)}"></label></div><div class="formrow"><label>Subjudul<input class="field" name="subtitle" value="${esc(state.settings.subtitle)}"></label></div></div><div class="formrow"><label>Judul banner (boleh memakai &lt;em&gt; untuk aksen)<input class="field" name="headline" value="${esc(state.settings.headline)}"></label></div><div class="formrow"><label>Deskripsi promosi<textarea class="field" rows="3" name="description">${esc(state.settings.description)}</textarea></label></div><div class="formgrid"><div class="formrow"><label>WhatsApp admin<input class="field" name="wa" required value="${esc(state.settings.wa)}"></label></div><div class="formrow"><label>Alamat<input class="field" name="address" value="${esc(state.settings.address)}"></label></div></div><div class="formrow"><label>Logo PNG/JPG/WEBP<input class="field" type="file" id="logoFile" accept="image/png,image/jpeg,image/webp"></label>${state.settings.logo?`<img class="preview" src="${safeImg(state.settings.logo)}">`:''}</div><div class="formrow"><label><input type="checkbox" name="showPrices" ${state.settings.showPrices?'checked':''}> Tampilkan harga di katalog</label></div><button class="btn">Simpan semua pengaturan</button></form>`;
if(tab==='orders')return `<h3>Pesanan yang tercatat di browser ini</h3>${state.orders.length?state.orders.map(o=>`<div class="admin-product" style="margin-bottom:10px;display:block"><div class="row"><b>${esc(o.id)} · ${esc(o.name)}</b><span class="pill">${esc(o.status)}</span></div><p class="small muted">${esc(o.date)} · ${esc(o.phone)} · ${money(o.total)}</p><p class="small">${o.items.map(i=>`${esc(i.name)} ×${i.qty}`).join(' · ')}</p><div class="row"><select class="field" style="max-width:220px" data-order="${esc(o.id)}">${['Menunggu konfirmasi','Diproses','Selesai','Dibatalkan'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select><a class="btn sm" target="_blank" rel="noopener" href="${waCustomer(o)}">WhatsApp ↗</a></div></div>`).join(''):'<p class="muted">Belum ada pesanan pada browser ini.</p>'}`;
return `<h3>Ekspor, impor, dan keamanan data</h3><p class="small muted">Simpan salinan JSON sebelum mengganti perangkat atau browser. Jangan membagikan file cadangan yang berisi data pesanan pribadi.</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="exportData()">⬇ Unduh cadangan JSON</button><label class="btn outline">⬆ Impor cadangan<input type="file" id="importFile" accept=".json,application/json" hidden></label></div><hr style="border:0;border-top:1px solid var(--border);margin:25px 0"><h3>PIN admin lokal</h3><p class="small muted">PIN disimpan sebagai hash, bukan kata sandi terbuka. Ini bukan pengganti keamanan server.</p><button class="btn outline" onclick="changePin()">Ganti PIN admin</button>`}
function waCustomer(o){return 'https://wa.me/'+String(o.phone).replace(/\D/g,'').replace(/^0/,'62')+'?text='+encodeURIComponent('Halo '+o.name+', mengenai pesanan '+o.id+' di Fatin Art.')}
function editProduct(id){editing=id||null;let p=state.products.find(x=>x.id===id)||{name:'',category:'',price:0,desc:'',img:''};modal(id?'Edit produk':'Tambah produk',`<form id="productForm"><div class="formrow"><label>Nama produk<input class="field" name="name" required maxlength="130" value="${esc(p.name)}"></label></div><div class="formgrid"><div class="formrow"><label>Kategori<input class="field" name="category" required maxlength="60" value="${esc(p.category)}"></label></div><div class="formrow"><label>Harga (Rp)<input class="field" type="number" name="price" min="0" required value="${Number(p.price)||0}"></label></div></div><div class="formrow"><label>Deskripsi<textarea class="field" name="desc" rows="3">${esc(p.desc)}</textarea></label></div><div class="formrow"><label>Upload foto PNG/JPG/WEBP<input class="field" id="productFile" type="file" accept="image/png,image/jpeg,image/webp"></label><p class="small muted">Foto diperkecil otomatis untuk menghemat penyimpanan browser.</p>${p.img?`<img class="preview" id="imagePreview" src="${safeImg(p.img)}">`:'<img class="preview hidden" id="imagePreview">'}</div><button class="btn full" type="submit">Simpan produk</button></form>`)}
async function fileToData(file){if(!file)return '';if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Gunakan PNG, JPG, atau WEBP');if(file.size>12*1024*1024)throw Error('Ukuran foto maksimal 12 MB');let bitmap=await createImageBitmap(file);let ratio=Math.min(1,1100/Math.max(bitmap.width,bitmap.height));let canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(bitmap.width*ratio));canvas.height=Math.max(1,Math.round(bitmap.height*ratio));canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close?.();return canvas.toDataURL('image/jpeg',.79)}
async function submitProduct(f){let data=new FormData(f),file=$('productFile').files[0],old=state.products.find(x=>x.id===editing);let img=old?.img||'';try{if(file)img=await fileToData(file)}catch(e){toast(e.message);return}let p={id:editing||'p'+Date.now(),name:String(data.get('name')).trim(),category:String(data.get('category')).trim(),price:Math.max(0,Number(data.get('price'))||0),desc:String(data.get('desc')).trim(),img};if(editing)state.products=state.products.map(x=>x.id===editing?p:x);else state.products.unshift(p);if(!save())return;closeModal();render();toast('Produk tersimpan')}
async function submitSettings(f){let d=new FormData(f),next={...state.settings};for(let k of ['business','subtitle','headline','description','wa','address'])next[k]=String(d.get(k)||'').trim();next.showPrices=f.elements.showPrices.checked;try{if($('logoFile').files[0])next.logo=await fileToData($('logoFile').files[0])}catch(e){toast(e.message);return}state.settings=next;if(save()){render();toast('Pengaturan tersimpan')}}
function exportData(){let data={...state,adminHash:''};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FATIN_ART_CADANGAN_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
async function importData(file){if(!file)return;try{let d=JSON.parse(await file.text());if(!Array.isArray(d.products)||!d.settings||d.products.length>2000)throw Error('Format file tidak sesuai');if(!confirm('Impor akan mengganti produk, pengaturan, dan pesanan saat ini. Lanjutkan?'))return;state={...state,products:d.products.map(p=>({id:String(p.id),name:String(p.name),category:String(p.category),price:Number(p.price)||0,desc:String(p.desc||''),img:safeImg(p.img)})),settings:{...state.settings,...d.settings,accent:/^#[0-9a-f]{6}$/i.test(d.settings.accent)?d.settings.accent:state.settings.accent,template:['creative','minimal','luxury'].includes(d.settings.template)?d.settings.template:'creative'},orders:Array.isArray(d.orders)?d.orders:[]};if(save()){render();toast('Data berhasil diimpor')}}catch(e){toast('Gagal impor: '+e.message)}}
function changePin(){modal('Ganti PIN admin',`<form id="changePinForm"><div class="formrow"><label>PIN baru (minimal 6 karakter)<input class="field" type="password" name="pin" minlength="6" required></label></div><button class="btn full">Simpan PIN baru</button></form>`)}
function render(){applyTheme();$('app').innerHTML=view==='admin'?adminView():publicView();if(view==='catalog')$('filters')?.addEventListener('click',e=>{let b=e.target.closest('[data-category]');if(b){category=b.dataset.category;render()}})}
document.addEventListener('click',e=>{let a=e.target.closest('[data-add]');if(a)add(a.dataset.add);let q=e.target.closest('[data-qty]');if(q)qty(q.dataset.qty,Number(q.dataset.delta));let t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render()}let edit=e.target.closest('[data-edit]');if(edit)editProduct(edit.dataset.edit);let del=e.target.closest('[data-delete]');if(del&&confirm('Hapus produk ini?')){state.products=state.products.filter(p=>p.id!==del.dataset.delete);save();render()}let tmpl=e.target.closest('[data-template]');if(tmpl){state.settings.template=tmpl.dataset.template;save();render()}let col=e.target.closest('[data-color]');if(col){state.settings.accent=col.dataset.color;save();render()}});
document.addEventListener('change',e=>{if(e.target.matches('[data-order]')){let o=state.orders.find(x=>x.id===e.target.dataset.order);if(o){o.status=e.target.value;save();toast('Status diperbarui')}}if(e.target.id==='importFile')importData(e.target.files[0]);if(e.target.id==='productFile'&&e.target.files[0]){let url=URL.createObjectURL(e.target.files[0]),img=$('imagePreview');img.src=url;img.classList.remove('hidden');img.onload=()=>URL.revokeObjectURL(url)}});
document.addEventListener('submit',async e=>{if(['productForm','settingsForm','checkoutForm','pinForm','changePinForm'].includes(e.target.id)){e.preventDefault();if(e.target.id==='productForm')await submitProduct(e.target);if(e.target.id==='settingsForm')await submitSettings(e.target);if(e.target.id==='checkoutForm')submitCheckout(e.target);if(e.target.id==='pinForm')await submitPin(e.target);if(e.target.id==='changePinForm'){state.adminHash=await hashPin(e.target.elements.pin.value);save();closeModal();toast('PIN diganti')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
load();render();if(new URLSearchParams(location.search).has('admin'))adminGate();
</script></body></html>
